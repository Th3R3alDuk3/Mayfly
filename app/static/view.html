<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <title>Mayfly</title>
  <script src="/tailwindcss-browser-4.2.4.js"></script>
</head>
<body class="h-full antialiased text-neutral-900 dark:text-neutral-200 
  bg-neutral-50 dark:bg-neutral-950">
  <div class="flex flex-col h-full">
    <header class="flex items-center justify-between shrink-0 h-14 px-5 
      border-b border-neutral-200 dark:border-neutral-800">
      <div class="flex items-center gap-2.5">
        <span class="text-sm font-semibold tracking-wide text-neutral-900 dark:text-neutral-100">
          Mayfly
        </span>
      </div>
      <div id="status-pill"
           class="flex h-7 min-w-12 items-center justify-center px-3 rounded-full
                  text-xs text-neutral-500 dark:text-neutral-400 bg-neutral-100 dark:bg-neutral-900
                  border border-neutral-200 dark:border-neutral-800"
           title="Container: offen / maximum">
        <span id="status-value" class="block text-center leading-none font-mono tabular-nums">
          &ndash;/&ndash;
        </span>
      </div>
    </header>
    <main class="flex-1 min-h-0">
      <iframe src="{{container_url}}"
              class="block w-full h-full border-0"
              allow="clipboard-read; clipboard-write"></iframe>
    </main>
  </div>

  <script>

    const statusValue = document.getElementById('status-value');

    async function refreshStatus() {
      try {
        const res = await fetch('/status', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { open, max } = await res.json();
        statusValue.textContent = `${open}/${max}`;
      } catch {
        statusValue.textContent = '\u2013/\u2013';
      }
    }

    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    new WebSocket(`${wsProto}://${location.host}/session/{{token}}/lifecycle`);

    refreshStatus();
    setInterval(refreshStatus, 60_000);

  </script>
</body>
</html>
