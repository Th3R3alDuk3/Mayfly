{% extends "base.html" %}

{% block content %}
<main class="h-full">
  <div id="loading" class="flex flex-col items-center justify-center h-full gap-5">
    <img src="/logo.png" alt="Mayfly" width="512" height="512"
         fetchpriority="high" decoding="async" class="h-56 w-56">
    <span id="status-text" class="text-sm text-neutral-500 dark:text-neutral-400">
      Starting Mayfly…
    </span>
    {% include "_spinner.html" %}
    <form id="start-form" method="post" action="/view" class="hidden"></form>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('start-form').submit();
</script>
{% endblock %}
