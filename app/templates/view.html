{% extends "base.html" %}

{% block title %}Mayfly Session{% endblock %}

{% block content %}
<div class="flex h-full flex-col">
  <header class="flex h-14 shrink-0 items-center justify-between
                 border-b border-neutral-200 px-5 dark:border-neutral-800">
    <div class="flex items-center gap-2.5">
      <img class="block h-12 w-12"
           src="/logo.png"
           alt=""
           width="512"
           height="512"
           decoding="async"
           fetchpriority="high">
      <span class="text-sm font-semibold text-neutral-900 dark:text-neutral-100">
        Mayfly
      </span>
    </div>
    <div class="flex items-center gap-2">
      <label class="inline-flex h-7 cursor-pointer items-center gap-1.5 rounded-md
                    border border-neutral-200 bg-neutral-100 px-3 text-xs
                    text-neutral-600 hover:bg-neutral-200
                    disabled:cursor-not-allowed disabled:opacity-50
                    dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-300
                    dark:hover:bg-neutral-800"
             data-upload-label
             title="Upload file to workspace">
        <span data-upload-text>Upload</span>
        <input type="file"
               class="hidden"
               data-upload-input
               disabled>
      </label>
      <div class="flex h-7 min-w-12 items-center justify-center rounded-md
                  border border-neutral-200 bg-neutral-100 px-3
                  text-xs text-neutral-500
                  dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-400"
           title="Sessions: active / limit">
        <span id="session-status-value"
              class="block text-center font-mono leading-none tabular-nums"
              aria-live="polite">
          -/-
        </span>
      </div>
    </div>
  </header>

  <main class="flex min-h-0 flex-1 flex-col"
        data-session-view
        data-session-token="{{ token }}">
    <div id="session-loading"
         class="flex min-h-0 flex-1 flex-col items-center justify-center gap-5">
      <img class="block h-56 w-56"
           src="/logo.png"
           alt=""
           width="512"
           height="512"
           decoding="async">
      <span id="session-message"
            class="text-sm text-neutral-500 dark:text-neutral-400"
            aria-live="polite">
        Starting Mayfly...
      </span>
      <div id="session-spinner">{% include "_loading_spinner.html" %}</div>
    </div>
    <iframe id="session-frame"
            class="hidden min-h-0 flex-1 w-full border-0"
            title="Mayfly session"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"
            allow="clipboard-read; clipboard-write"
            referrerpolicy="no-referrer"></iframe>
  </main>

  <div class="fixed inset-0 z-50 hidden items-center justify-center
              bg-neutral-950/60 backdrop-blur-sm"
       data-session-password-modal
       role="dialog"
       aria-modal="true"
       aria-labelledby="session-password-title"
       hidden>
    <div class="mx-4 w-full max-w-sm rounded-lg border border-neutral-200
                bg-white p-5 shadow-xl
                dark:border-neutral-800 dark:bg-neutral-900">
      <h2 id="session-password-title"
          class="text-sm font-semibold text-neutral-900 dark:text-neutral-100">
        Session password
      </h2>
      <p class="mt-1 text-xs text-neutral-500 dark:text-neutral-400">
        Use this password to unlock your Mayfly session in the iframe.
      </p>
      <div class="mt-4 flex items-center gap-2 rounded-md border
                  border-neutral-200 bg-neutral-50 px-3 py-2
                  dark:border-neutral-800 dark:bg-neutral-950">
        <code id="session-password"
              class="flex-1 truncate font-mono text-sm font-semibold
                     text-emerald-700 dark:text-emerald-400"
              data-session-password-value></code>
        <button type="button"
                class="shrink-0 rounded-md border border-neutral-200
                       bg-neutral-100 px-2 py-1 text-xs font-medium
                       text-neutral-700 hover:bg-neutral-200
                       dark:border-neutral-700 dark:bg-neutral-800
                       dark:text-neutral-200 dark:hover:bg-neutral-700"
                data-session-password-copy>
          <span data-session-password-copy-text>Copy</span>
        </button>
      </div>
      <div class="mt-5 flex justify-end">
        <button type="button"
                class="rounded-md border border-neutral-300 bg-neutral-200
                       px-4 py-1.5 text-sm font-medium text-neutral-900
                       hover:bg-neutral-300
                       dark:border-neutral-700 dark:bg-neutral-800
                       dark:text-neutral-100 dark:hover:bg-neutral-700"
                data-session-password-dismiss>
          Continue
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
