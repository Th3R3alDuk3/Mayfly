{% extends "base.html" %}

{% block title %}Mayfly Session{% endblock %}

{% block content %}
<div class="flex h-full flex-col">
  <header class="flex h-14 shrink-0 items-center justify-between border-b border-neutral-200 px-5 dark:border-neutral-800">
    <div class="flex items-center gap-2.5">
      <img class="block h-12 w-12"
           src="/logo.png"
           alt=""
           width="512"
           height="512"
           decoding="async"
           fetchpriority="high">
      <span class="text-sm font-semibold text-neutral-900 dark:text-neutral-100">
        Mayfly
      </span>
    </div>
    <div class="flex h-7 min-w-12 items-center justify-center rounded-full border border-neutral-200 bg-neutral-100 px-3 text-xs text-neutral-500 dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-400"
         title="Sessions: active / limit">
      <span id="session-status-value"
            class="block text-center font-mono leading-none tabular-nums"
            aria-live="polite">
        -/-
      </span>
    </div>
  </header>

  <main class="min-h-0 flex-1" data-session-view data-session-token="{{ token }}">
    <div id="session-loading" class="flex h-full flex-col items-center justify-center gap-5">
      <img class="block h-56 w-56"
           src="/logo.png"
           alt=""
           width="512"
           height="512"
           decoding="async">
      <span id="session-message"
            class="text-sm text-neutral-500 dark:text-neutral-400"
            aria-live="polite">
        Starting Mayfly...
      </span>
      <div id="session-spinner">{% include "_loading_spinner.html" %}</div>
    </div>
    <iframe id="session-frame"
            class="hidden h-full w-full border-0"
            title="Mayfly session"
            allow="clipboard-read; clipboard-write"
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"></iframe>
  </main>
</div>
{% endblock %}
