<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <title>Mayfly — Error {{ status_code }}</title>
  <script src="/tailwindcss-browser-4.2.4.js"></script>
</head>
<body class="h-full antialiased text-neutral-900 dark:text-neutral-200
             bg-neutral-50 dark:bg-neutral-950">
  <main class="h-full">
    <div class="flex flex-col items-center justify-center h-full gap-5">
      <img src="/logo.png" alt="Mayfly" class="h-56 w-56 select-none" draggable="false">
      <div class="text-6xl font-semibold font-mono tabular-nums
                  text-neutral-900 dark:text-neutral-100">
        {{ status_code }}
      </div>
      <span class="text-sm text-neutral-500 dark:text-neutral-400 text-center max-w-sm px-6">
        {{ detail }}
      </span>
      <a href="/"
         class="mt-2 px-5 py-2 rounded-md text-sm font-medium
                text-neutral-900 dark:text-neutral-100
                bg-neutral-200 dark:bg-neutral-800
                hover:bg-neutral-300 dark:hover:bg-neutral-700
                border border-neutral-300 dark:border-neutral-700
                transition-colors">
        Neue Session starten
      </a>
    </div>
  </main>
</body>
</html>
