services:
  mayfly:
    profiles: ["build"]
    build:
      context: ./docker
      dockerfile: Dockerfile.mayfly
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
        NPM_REGISTRY: ${NPM_REGISTRY}
        NPM_STRICT_SSL: ${NPM_STRICT_SSL}
        MAYFLY_PORT: ${MAYFLY_PORT}
    image: ${MAYFLY_IMAGE}

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
        APP_PORT: ${APP_PORT}
    image: app:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT}"]
    ports:
      - "${APP_BIND_HOST}:${APP_PORT}:${APP_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mayfly-net

networks:
  mayfly-net:
    name: mayfly-net
