services:
  mayfly:
    profiles: ["build"]
    build:
      context: ./docker
      dockerfile: Dockerfile.mayfly
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
        NPM_REGISTRY: ${NPM_REGISTRY}
        NPM_STRICT_SSL: ${NPM_STRICT_SSL}
        OPENCODE_VERSION: ${OPENCODE_VERSION}
        OPENCHAMBER_VERSION: ${OPENCHAMBER_VERSION}
    image: ${SANDBOX_IMAGE}

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: mayfly-app:0.4.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8123:8123"
    devices:
      - /dev/kvm
    volumes:
      - mayfly-data:/root/.microsandbox
      - ./sandbox:/app/sandbox:ro

volumes:
  mayfly-data:
