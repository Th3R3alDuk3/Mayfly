[project]
name = "mayfly"
version = "0.5.0"
description = "Disposable OpenChamber coding sessions in microVMs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.13.0",
    "fastmcp>=4.1.4",
    "httpx2[ws]>=2.16.0",
    "microsandbox>=0.7.11",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "wsproto>=1.3.2",
]

[tool.uv]
allow-insecure-host = []
index = [{ url = "https://pypi.org/simple", default = true }]
