[project]
name = "Mayfly"
version = "0.3.0"
description = "FastAPI service for ephemeral per-session OpenCode/OpenChamber Docker containers"
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "mayfly",
    "opencode",
    "openchamber",
    "ephemeral-containers",
]
dependencies = [
    "fastapi>=0.115",
    "fastapi-offline>=1.7.6",
    "uvicorn[standard]>=0.30",
    "aiodocker>=0.23",
    "pydantic-settings>=2.14.2",
    "fastmcp>=3.2.4",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=16.0",
]
